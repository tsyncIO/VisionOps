[project]
name = "visionops"
version = "0.1.0"
description = "Agentic Multimodal Visual Analytics & Reasoning Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sse-starlette>=2.1.0",
    "vllm>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: marks tests that require GPU/vLLM (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
